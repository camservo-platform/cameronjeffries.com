# Exposes the USB DAC's ALSA devices as the devic.es/audio resource so that
# Navidrome's jukebox mode can use them without running privileged.
# Based on https://github.com/squat/generic-device-plugin/blob/main/manifests/generic-device-plugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      # Only the node with the USB DAC needs the plugin.
      nodeSelector:
        audio: usb-dac
      containers:
        - image: squat/generic-device-plugin:0.2.0
          args:
            - --device
            - |
              name: audio
              groups:
                - paths:
                    - path: /dev/snd
          name: generic-device-plugin
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
