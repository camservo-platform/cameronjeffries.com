apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: navidrome
  name: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: navidrome
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: navidrome
    spec:
      containers:
        - env:
            - name: ND_BASEURL
              value: /navidrome
            - name: ND_DEFAULTTHEME
              value: electricPurple
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_ENABLEUSEREDITING
              value: "true"
            - name: ND_LASTFM_ENABLED
              value: "true"
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: 1h
            - name: ND_SESSIONTIMEOUT
              value: 24h
            - name: ND_UIWELCOMEMESSAGE
              value: What's up buttfaces?
            - name: ND_MUSICFOLDER
              value: /data/music
            - name: ND_DATAFOLDER
              value: /data/data
          image: deluan/navidrome:0.54.4
          name: navidrome
          ports:
            - containerPort: 4533
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: navidrome-data
      restartPolicy: Always
      volumes:
        - name: navidrome-data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: secret-volume
          secret:
            secretName: navidrome