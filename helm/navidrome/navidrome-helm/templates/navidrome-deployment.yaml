apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -c
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: navidrome
  name: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: navidrome
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -c
        kompose.version: 1.34.0 (HEAD)
        checksum/config: {{ include (print $.Template.BasePath "/navidrome-configmap.yaml") . | sha256sum }}
      labels:
        io.kompose.service: navidrome
    spec:
      # The USB DAC used for jukebox mode is plugged into this node.
      nodeSelector:
        audio: usb-dac
      containers:
        - env:
            - name: ND_BASEURL
              value: /navidrome
            - name: ND_DEFAULTTHEME
              value: electricPurple
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_ENABLEUSEREDITING
              value: "true"
            - name: ND_LASTFM_ENABLED
              value: "true"
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: 1h
            - name: ND_SESSIONTIMEOUT
              value: 24h
            - name: ND_UIWELCOMEMESSAGE
              value: What's up buttfaces?
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_CONFIGFILE
              value: /config/navidrome.toml
          image: deluan/navidrome:0.58.5
          name: navidrome
          ports:
            - containerPort: 4533
              protocol: TCP
          # The USB DAC's /dev/snd, exposed by generic-device-plugin.
          resources:
            limits:
              devic.es/audio: 1
          volumeMounts:
            - mountPath: /data
              name: navidrome-data
            - mountPath: /libraries/bunnywhiskers
              name: bunnywhiskers
            - mountPath: /music
              name: music
            - mountPath: /config
              name: config
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: navidrome-data
          nfs:
            server: pi-nas.local
            path: /navidrome-data
            readOnly: false
        - name: bunnywhiskers
          nfs:
            server: pi-nas.local
            path: /bunnywhiskers
            readOnly: true
        - name: music
          nfs:
            server: pi-nas.local
            path: /music
            readOnly: true
        - name: config
          configMap:
            name: navidrome-config
