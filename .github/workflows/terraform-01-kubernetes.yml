name: Terraform Deploy

on:
  push:
    branches:
      - main
      - cjeffries/test/kubernetes
  release:
    types:
      - published
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply Terraform changes?"
        required: false
        default: false
        type: boolean
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod
env: 
  TERRAFORM_PATH: terraform/01-kubernetes
  TOFU_VERSION: 1.7
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  set-env:
    uses: camservo-org/github-actions/.github/workflows/set_env.yml@main
  deploy:
    needs: set-env
    uses: camservo-org/github-actions/.github/workflows/deploy_terraform.yml@main
    with:
      deploy: ${{ needs.set-env.outputs.deploy }}
      tf_path: ${{ env.TERRAFORM_PATH }}
      tf_vars: |
        {
            "linode_api_key": "${{ secrets.LINODE_API_KEY }}",
            "keycloak_secret": "${{ secrets.KEYCLOAK_SECRET }}"
        }
      tf_additional_args: "-var-file vars/test.tfvars"
    secrets: inherit

    